<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر البرمجيات | MightMess Store</title>
    
    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- اللوجو والاسم -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl overflow-hidden bg-gray-800 border border-gray-700 flex items-center justify-center shadow-sm">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-code text-red-500\'></i>'">
                </div>
                <span class="font-bold text-lg bg-gradient-to-r from-red-500 to-rose-400 bg-clip-text text-transparent">متجر البرمجيات</span>
            </div>
            
            <!-- أزرار التحكم -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- Dark/Light Mode Toggle -->
                <button id="themeToggle" type="button" class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-gray-300 hover:bg-gray-700 transition cursor-pointer">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-16 px-4 text-center bg-gradient-to-b from-red-950/20 to-transparent">
        <div class="max-w-3xl mx-auto space-y-4">
            <span class="inline-block py-1 px-3 rounded-full bg-red-950/50 text-red-400 text-xs font-bold tracking-wide uppercase border border-red-900/30">
                برمجيات وأكواد احترافية جاهزة للشراء
            </span>
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight">
                أحدث <span class="bg-gradient-to-r from-red-500 to-rose-400 bg-clip-text text-transparent">المشاريع والتطبيقات</span> للبيع
            </h1>
            <p class="text-gray-400 text-base sm:text-lg max-w-2xl mx-auto">
                تصفح أفضل الحلول البرمجية الجاهزة، واطلب الكود مباشرة وتواصل معي عبر ديسكورد لإتمام الشراء.
            </p>
        </div>
    </section>

    <!-- Main Content: Projects Section -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-store text-red-500"></i>
                <span>المشاريع المتاحة للبيع</span>
            </h2>
            <span id="projectsCount" class="text-sm font-medium px-3 py-1 rounded-lg bg-gray-800 text-gray-300 border border-gray-700/50">
                0 مشروع
            </span>
        </div>

        <!-- Projects Grid -->
        <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic projects inserted here via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-sm text-gray-400">
        <p>جميع الحقوق محفوظة &copy; MightMess Store 2026</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const DISCORD_SERVER_LINK = "https://discord.gg/ea9UAfHnfW";

        // قائمة المنتجات الخاصة بك (أي مشروع تضيفه هنا سيظهر لكل الزوار في العالم فوراً)
        const storeProjects = [
            {
                id: '1',
                title: 'TaskFlow - نظام إدارة المهام والإنتاجية',
                desc: 'تطبيق متكامل لإدارة المهام وتتبع الإنتاجية مدعوم بمؤقت Pomodoro الذكي مع حفظ البيانات.',
                price: '$25',
                demo: '#',
                buyLink: DISCORD_SERVER_LINK,
                tech: ['HTML5', 'Tailwind CSS', 'JavaScript']
            }
            // يمكنك إضافة مشاريع جديدة هنا بسهولة بنفس التنسيق
        ];

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            const countBadge = document.getElementById('projectsCount');
            
            if (countBadge) countBadge.innerText = `${storeProjects.length} مشروع`;

            if (grid) {
                grid.innerHTML = storeProjects.map(p => `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-sm hover:border-red-500/50 transition flex flex-col justify-between group">
                        <div>
                            <div class="flex items-start justify-between mb-3">
                                <h3 class="font-bold text-lg group-hover:text-red-500 transition text-gray-100">${escapeHtml(p.title)}</h3>
                            </div>

                            <p class="text-gray-400 text-sm mb-4 line-clamp-3">${escapeHtml(p.desc)}</p>
                            
                            <div class="flex flex-wrap gap-1.5 mb-4">
                                ${(p.tech || []).map(t => `<span class="px-2.5 py-1 rounded-lg bg-red-950/40 text-red-400 text-xs font-semibold border border-red-900/20">${escapeHtml(t.trim())}</span>`).join('')}
                            </div>
                        </div>

                        <div class="pt-4 border-t border-gray-800 flex items-center justify-between gap-3">
                            <span class="text-xl font-black text-white">${escapeHtml(p.price || 'حسب الطلب')}</span>
                            
                            <div class="flex items-center gap-2">
                                ${p.demo && p.demo !== '#' ? `<a href="${escapeHtml(p.demo)}" target="_blank" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-eye"></i> معاينة</a>` : ''}
                                <a href="${escapeHtml(p.buyLink || DISCORD_SERVER_LINK)}" target="_blank" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-indigo-600/25 cursor-pointer"><i class="fa-brands fa-discord"></i> التواصل ديسكورد</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-400';
            } else {
                if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-gray-300';
            }
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                }
                updateThemeIcon();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProjects();
        });
    </script>
</body>
</html>
