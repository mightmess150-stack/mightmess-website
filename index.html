<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mightmess store</title>
    
    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 transition-colors duration-300 min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- اللوجو والاسم -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl overflow-hidden bg-gray-800 border border-gray-700 flex items-center justify-center shadow-sm">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-code text-red-500\'></i>'">
                </div>
                <span class="font-bold text-lg bg-gradient-to-r from-red-500 to-rose-400 bg-clip-text text-transparent">متجر البرمجيات</span>
            </div>
            
            <!-- أزرار التحكم -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- زر الإضافة (يظهر فقط للأدمن) -->
                <button id="addProjectBtn" onclick="openModal()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md shadow-red-600/20 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>إضافة مشروع للبيع</span>
                </button>

                <!-- زر تسجيل الدخول / الخروج -->
                <button id="authBtn" onclick="openLoginModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-semibold border border-gray-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-user-lock text-red-500"></i>
                    <span id="authBtnText">دخول الأدمن</span>
                </button>

                <!-- Dark/Light Mode Toggle -->
                <button id="themeToggle" class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-gray-300 hover:bg-gray-700 transition">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-16 px-4 text-center bg-gradient-to-b from-red-950/20 to-transparent">
        <div class="max-w-3xl mx-auto space-y-4">
            <span class="inline-block py-1 px-3 rounded-full bg-red-950/50 text-red-400 text-xs font-bold tracking-wide uppercase border border-red-900/30">
                برمجيات وأكواد احترافية جاهزة للشراء
            </span>
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight">
                أحدث <span class="bg-gradient-to-r from-red-500 to-rose-400 bg-clip-text text-transparent">المشاريع والتطبيقات</span> للبيع
            </h1>
            <p class="text-gray-400 text-base sm:text-lg max-w-2xl mx-auto">
                تصفح أفضل الحلول البرمجية الجاهزة، واطلب الكود مباشرة وتواصل معي عبر ديسكورد لإتمام الشراء.
            </p>
        </div>
    </section>

    <!-- Main Content: Projects Section -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-store text-red-500"></i>
                <span>المشاريع المتاحة</span>
            </h2>
            <span id="projectsCount" class="text-sm font-medium px-3 py-1 rounded-lg bg-gray-800 text-gray-300 border border-gray-700/50">
                0 مشروع
            </span>
        </div>

        <!-- Projects Grid -->
        <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic projects inserted here via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 px-4">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-800 flex items-center justify-center text-gray-500 text-3xl">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-lg font-bold mb-1">لا توجد مشاريع معروضة حالياً</h3>
            <p class="text-gray-400 text-sm mb-4">عد لاحقاً لرؤية أحدث البرمجيات المضافة.</p>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-800">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-shield-halved text-red-500"></i> تسجيل دخول الأدمن
                </h3>
                <button onclick="closeLoginModal()" class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-300">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-red-500 text-sm text-gray-100" placeholder="mightmess150@gmail.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-300">
